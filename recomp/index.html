<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리컴프 · 바디 리컴포지션 트래커</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0e1116;--surf:#171b22;--surf2:#1f2530;--line:#2a3140;--tx:#e8ecf2;--mut:#8b95a5;
    --acc:#f5b94a;--acc-tx:#1a1206;--teal:#3ecfb2;--crit:#f0655c;--blue:#6d9ef7;
    --carb:#f5b94a;--pro:#3ecfb2;--fat:#f0879e;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f4f5f8;--surf:#ffffff;--surf2:#eef0f4;--line:#dde1e8;--tx:#1a1e26;--mut:#6b7484;
      --acc:#e09b17;--acc-tx:#fff;--teal:#0da88b;--crit:#dc4a41;--blue:#3b6fd4}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--tx);line-height:1.55;-webkit-font-smoothing:antialiased}
  .mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:1.1rem 1rem 5.6rem}
  h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--mut);font-size:.83rem}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:1rem 1.05rem;margin-top:.85rem}
  .card h2{font-size:.78rem;font-weight:700;color:var(--mut);letter-spacing:.06em;margin-bottom:.6rem;
    display:flex;justify-content:space-between;align-items:center}
  .card h2 .more{color:var(--acc);cursor:pointer;letter-spacing:0}
  .row{display:flex;align-items:center;gap:.65rem}
  .grow{flex:1}
  .muted{color:var(--mut)}
  .empty{text-align:center;color:var(--mut);padding:1.3rem .5rem;font-size:.86rem}
  button{font-family:inherit;cursor:pointer;color:var(--tx)}
  .btn{background:var(--acc);color:var(--acc-tx);border:none;border-radius:11px;padding:.75rem 1.1rem;
    font-size:.92rem;font-weight:700;width:100%}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
  .btn.gray{background:var(--surf2);color:var(--tx);border:1px solid var(--line)}
  .btn.sm{width:auto;padding:.42rem .8rem;font-size:.8rem;border-radius:8px}
  .btn.danger{background:transparent;border:1px solid var(--crit);color:var(--crit)}
  .chip{display:inline-block;background:var(--surf2);border:1px solid var(--line);border-radius:100px;
    padding:.28rem .75rem;font-size:.79rem;margin:.18rem .22rem .18rem 0;cursor:pointer}
  .chip:hover{border-color:var(--acc);color:var(--acc)}
  input,select{font-family:inherit;background:var(--surf2);border:1px solid var(--line);border-radius:9px;
    padding:.62rem .8rem;font-size:.92rem;color:var(--tx);outline:none;width:100%}
  input:focus{border-color:var(--acc)}
  label{font-size:.78rem;font-weight:600;color:var(--mut);display:block;margin:.75rem 0 .28rem}
  .seg{display:flex;gap:.4rem}
  .seg button{flex:1;background:var(--surf2);border:1.5px solid var(--line);border-radius:9px;
    padding:.6rem .25rem;font-size:.83rem}
  .seg button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:var(--surf);border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;padding:.55rem 0 .5rem;color:var(--mut);
    font-size:.67rem;display:flex;flex-direction:column;align-items:center;gap:.12rem}
  nav button .ic{font-size:1.2rem;line-height:1}
  nav button.on{color:var(--acc);font-weight:700}
  .tab{display:none}
  .tab.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .bar{height:7px;background:var(--surf2);border-radius:100px;overflow:hidden;margin-bottom:.5rem}
  .bar i{display:block;height:100%;border-radius:100px;transition:width .3s ease}
  .m-row{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:.12rem}
  /* 운동 카드 */
  .ex{border-top:1px solid var(--line);padding:.7rem 0}
  .ex:first-of-type{border-top:none}
  .ex .name{font-weight:700;font-size:.93rem}
  .ex .meta{font-size:.76rem;color:var(--mut)}
  .ex .sugg{font-size:.76rem;color:var(--acc);font-weight:700}
  .setrow{display:flex;align-items:center;gap:.4rem;margin-top:.4rem}
  .setrow .no{width:1.4rem;font-size:.75rem;color:var(--mut);text-align:center;flex-shrink:0}
  .setrow input{padding:.42rem .5rem;font-size:.85rem;text-align:center}
  .setrow .ok{width:36px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:transparent;
    color:var(--mut);font-size:.85rem;font-weight:800;flex-shrink:0}
  .setrow .ok.done{background:var(--teal);border-color:var(--teal);color:#0e1116}
  .timer-row{display:flex;gap:.4rem;margin-top:.65rem}
  .timer-row button{flex:1;background:var(--surf2);border:1px solid var(--line);border-radius:8px;
    padding:.4rem 0;font-size:.78rem;color:var(--mut)}
  #timerPill{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:4.6rem;background:var(--acc);
    color:var(--acc-tx);font-weight:800;border-radius:100px;padding:.55rem 1.2rem;font-size:.95rem;z-index:60;cursor:pointer}
  /* 물/영양제 */
  .cups{display:flex;gap:.35rem;flex-wrap:wrap}
  .cup{width:36px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-size:1rem;opacity:.45}
  .cup.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 18%,transparent);opacity:1}
  .supp{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-top:1px solid var(--line)}
  .supp:first-of-type{border-top:none}
  .supp .chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:.85rem;flex-shrink:0}
  .supp .chk.done{background:var(--teal);border-color:var(--teal);color:#0e1116}
  /* 식단 */
  .food{display:flex;justify-content:space-between;align-items:center;padding:.35rem 0;font-size:.86rem}
  .food .fk{color:var(--mut);font-size:.76rem;margin-left:.45rem}
  .fx{background:none;border:none;color:var(--mut);opacity:.55;font-size:.9rem;padding:.1rem .3rem}
  .fx:hover{color:var(--crit);opacity:1}
  .datebar{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:.7rem}
  .datebar button{background:var(--surf2);border:1px solid var(--line);border-radius:8px;width:34px;height:30px;font-size:.85rem}
  .datebar .d{font-weight:700;font-size:.9rem}
  /* 진척 */
  .signal{display:flex;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--line);font-size:.85rem;align-items:flex-start}
  .signal:first-of-type{border-top:none}
  .signal .dot{flex-shrink:0;margin-top:.35rem;width:8px;height:8px;border-radius:50%}
  canvas{width:100%;display:block}
  .kv{display:flex;justify-content:space-between;padding:.42rem 0;font-size:.88rem;border-top:1px solid var(--line)}
  .kv:first-of-type{border-top:none}
  .kv b{font-weight:700}
  .plan-li{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-top:1px solid var(--line);font-size:.86rem}
  .plan-li:first-of-type{border-top:none}
  .plan-li .idx{width:24px;height:24px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;
    justify-content:center;font-size:.72rem;font-weight:700;color:var(--mut);flex-shrink:0}
  .plan-li.today .idx{background:var(--acc);color:var(--acc-tx)}
  /* 모달 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .modal.on{display:flex}
  .sheet{background:var(--surf);width:100%;max-width:480px;border-radius:18px 18px 0 0;
    padding:1.2rem 1.1rem 1.5rem;max-height:88vh;overflow-y:auto}
  .sheet h3{font-size:1.05rem;font-weight:800}
  .steps{display:flex;gap:.3rem;margin:.75rem 0 .2rem}
  .steps i{flex:1;height:4px;border-radius:100px;background:var(--line)}
  .steps i.on{background:var(--acc)}
  .food-li{display:flex;justify-content:space-between;align-items:center;padding:.55rem .15rem;
    border-bottom:1px solid var(--line);cursor:pointer;font-size:.88rem}
  .food-li .k{color:var(--mut);font-size:.78rem}
  .food-li:hover{background:color-mix(in srgb,var(--acc) 7%,transparent)}
  .toast{position:fixed;bottom:5.4rem;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);
    padding:.5rem 1rem;border-radius:100px;font-size:.83rem;font-weight:600;opacity:0;transition:opacity .2s;z-index:200;pointer-events:none}
  .toast.on{opacity:.93}
</style>
</head>
<body>
<div class="app">
  <div class="row" style="justify-content:space-between;align-items:baseline">
    <h1>리컴프<span style="color:var(--acc)">·</span>트랙</h1>
    <span class="sub mono" id="hdrPhase"></span>
  </div>
  <div class="bar" style="margin-top:.5rem"><i id="hdrBar" style="background:var(--acc);width:0%"></i></div>

  <!-- ===== 오늘 ===== -->
  <section class="tab" id="tab-today">
    <div class="card" style="border-color:color-mix(in srgb,var(--acc) 45%,var(--line))">
      <h2>아침 브리핑</h2>
      <div id="briefing" style="font-size:.88rem"></div>
    </div>

    <div class="card">
      <h2>오늘 측정</h2>
      <div class="row">
        <input id="wIn" type="number" step="0.1" inputmode="decimal" placeholder="체중 kg">
        <input id="waistIn" type="number" step="0.1" inputmode="decimal" placeholder="허리 cm (선택)">
        <button class="btn sm" id="wSave" style="flex-shrink:0">기록</button>
      </div>
    </div>

    <div class="card" id="workoutCard"></div>

    <div class="card">
      <h2>물 <span class="more mono" id="waterCnt">0 / 8잔</span></h2>
      <div class="cups" id="cups"></div>
    </div>

    <div class="card">
      <h2>영양제</h2>
      <div id="suppList"></div>
      <div class="row" style="margin-top:.6rem">
        <input id="suppName" placeholder="영양제 추가" maxlength="20">
        <button class="btn sm gray" id="suppAdd" style="flex-shrink:0">추가</button>
      </div>
    </div>
  </section>

  <!-- ===== 식단 ===== -->
  <section class="tab" id="tab-fuel">
    <div class="datebar">
      <button id="dPrev">◀</button><span class="d mono" id="dLabel"></span><button id="dNext">▶</button>
    </div>
    <div class="card">
      <div class="row" style="text-align:center">
        <div class="grow"><div class="mono" style="font-size:1.3rem;font-weight:800" id="fKcal">0</div><div class="sub">섭취 kcal</div></div>
        <div class="grow"><div class="mono" style="font-size:1.3rem;font-weight:800" id="fLeft">0</div><div class="sub">남은 kcal</div></div>
        <div class="grow"><div class="mono" style="font-size:1.3rem;font-weight:800;color:var(--pro)" id="fPro">0g</div><div class="sub">단백질</div></div>
      </div>
      <div id="fBars" style="margin-top:.9rem"></div>
    </div>
    <div class="card">
      <h2>자주 먹는 음식</h2>
      <div id="freqChips"></div>
    </div>
    <div id="mealList"></div>
  </section>

  <!-- ===== 진척 ===== -->
  <section class="tab" id="tab-prog">
    <div class="card">
      <h2>코칭 신호</h2>
      <div id="signals"></div>
    </div>
    <div class="card">
      <h2>체중 — 일별 · 7일 평균 · 목표선</h2>
      <canvas id="wChart" width="680" height="320"></canvas>
    </div>
    <div class="card" id="waistCard">
      <h2>허리둘레 — 가드레일(최저점 +3cm)</h2>
      <canvas id="waistChart" width="680" height="220"></canvas>
    </div>
    <div class="card">
      <h2>주간 요약 (최근 7일 vs 이전 7일)</h2>
      <div id="weekly"></div>
    </div>
    <div class="card">
      <h2>백업</h2>
      <div class="row">
        <button class="btn sm gray grow" id="expJson">JSON 내보내기</button>
        <button class="btn sm gray grow" id="expCsv">CSV 내보내기</button>
        <button class="btn sm gray grow" id="impJson">가져오기</button>
      </div>
      <input type="file" id="impFile" accept=".json" style="display:none">
    </div>
  </section>

  <!-- ===== 플랜 ===== -->
  <section class="tab" id="tab-plan">
    <div class="card">
      <h2>내 목표</h2>
      <div id="planProfile"></div>
    </div>
    <div class="card">
      <h2>주간 분할</h2>
      <div id="weekPlan"></div>
    </div>
    <div class="card">
      <button class="btn ghost" id="reOnboard">프로필·목표 다시 설정</button>
      <div style="height:.45rem"></div>
      <button class="btn danger" id="resetAll">모든 데이터 초기화</button>
    </div>
  </section>

  <nav>
    <button data-tab="today" class="on"><span class="ic">📌</span>오늘</button>
    <button data-tab="fuel"><span class="ic">🍚</span>식단</button>
    <button data-tab="prog"><span class="ic">📈</span>진척</button>
    <button data-tab="plan"><span class="ic">🗺️</span>플랜</button>
  </nav>
</div>

<button id="timerPill" class="mono"></button>

<!-- 온보딩 -->
<div class="modal" id="onboard"><div class="sheet">
  <h3>내 몸에 맞는 플랜 만들기</h3>
  <div class="sub">신체 정보를 넣으면 목표 칼로리·단백질과 운동 루틴을 자동 설계해요. 데이터는 이 브라우저에만 저장됩니다.</div>
  <div class="steps"><i class="on"></i><i></i><i></i></div>
  <div id="obBody"></div>
  <div style="margin-top:1.1rem"><button class="btn" id="obNext">다음</button></div>
</div></div>

<!-- 음식 추가 -->
<div class="modal" id="foodModal"><div class="sheet">
  <h3 id="fmTitle">음식 추가</h3>
  <div style="margin:.7rem 0 .4rem"><input id="fmSearch" placeholder="음식 검색 (예: 닭가슴살, 김치찌개)"></div>
  <div class="row" style="margin-bottom:.5rem">
    <span class="sub" style="flex-shrink:0">양:</span>
    <div class="seg grow" id="fmQty">
      <button data-q="0.5">0.5</button><button data-q="1" class="on">1</button><button data-q="1.5">1.5</button><button data-q="2">2</button>
    </div>
  </div>
  <div id="fmResults" style="max-height:38vh;overflow-y:auto"></div>
  <div style="border-top:1px solid var(--line);margin-top:.7rem;padding-top:.7rem">
    <div class="sub" style="font-weight:700;margin-bottom:.4rem">직접 입력 (DB에 없을 때)</div>
    <div class="row">
      <input id="fmName" placeholder="이름" style="flex:2">
      <input id="fmK" type="number" inputmode="numeric" placeholder="kcal" style="flex:1">
      <input id="fmP" type="number" inputmode="numeric" placeholder="단백질g" style="flex:1">
    </div>
    <div class="row" style="margin-top:.5rem">
      <button class="btn sm gray grow" id="fmAddOnce">한 번만 기록</button>
      <button class="btn sm grow" id="fmAddSave">★ 기록 + 내 음식 저장</button>
    </div>
  </div>
  <div style="margin-top:.8rem"><button class="btn ghost" id="fmClose">닫기</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ================= 상수 ================= */
const KEY='recomp-v1';
const todayStr=new Date().toISOString().slice(0,10);
const DAY_MS=864e5;

const EX_DB={
  chest:[{n:'벤치프레스',p:'gym',lo:0},{n:'인클라인 덤벨 프레스',p:'gym',lo:0},{n:'체스트 프레스 머신',p:'gym',lo:0},{n:'딥스',p:'both',lo:0},{n:'푸시업',p:'home',lo:0},{n:'발 올린 푸시업',p:'home',lo:0}],
  back:[{n:'랫풀다운',p:'gym',lo:0},{n:'바벨 로우',p:'gym',lo:0},{n:'시티드 케이블 로우',p:'gym',lo:0},{n:'풀업',p:'both',lo:0},{n:'원암 덤벨 로우',p:'home',lo:0},{n:'밴드 로우',p:'home',lo:0}],
  legs:[{n:'바벨 스쿼트',p:'gym',lo:1},{n:'레그 프레스',p:'gym',lo:1},{n:'루마니안 데드리프트',p:'gym',lo:1},{n:'레그 컬',p:'gym',lo:1},{n:'고블릿 스쿼트',p:'home',lo:1},{n:'불가리안 스플릿 스쿼트',p:'home',lo:1},{n:'힙 쓰러스트',p:'both',lo:1}],
  shoulders:[{n:'오버헤드 프레스',p:'gym',lo:0},{n:'사이드 래터럴 레이즈',p:'both',lo:0},{n:'페이스 풀',p:'gym',lo:0},{n:'덤벨 숄더 프레스',p:'home',lo:0},{n:'파이크 푸시업',p:'home',lo:0}],
  arms:[{n:'바벨 컬',p:'gym',lo:0},{n:'케이블 푸시다운',p:'gym',lo:0},{n:'덤벨 컬',p:'both',lo:0},{n:'벤치 딥스',p:'home',lo:0}],
  core:[{n:'플랭크',p:'both',lo:0},{n:'행잉 레그 레이즈',p:'gym',lo:0},{n:'레그 레이즈',p:'home',lo:0},{n:'케이블 크런치',p:'gym',lo:0},{n:'덤벨 크런치',p:'home',lo:0}],
  cardio:[{n:'경사 걷기 25분',p:'gym',lo:0},{n:'로잉머신 15분',p:'gym',lo:0},{n:'사이클 20분',p:'gym',lo:0},{n:'실외 파워워킹 30분',p:'home',lo:0},{n:'버피 10분',p:'home',lo:0}]
};
const GROUP_KO={chest:'가슴',back:'등',legs:'하체',shoulders:'어깨',arms:'팔',core:'코어',cardio:'유산소'};

const FOOD_DB=[
  ['흰쌀밥 1공기',300,67,5,1],['현미밥 1공기',280,61,6,2],['잡곡밥 1공기',290,63,6,2],
  ['닭가슴살 100g',110,0,23,2],['닭가슴살 스테이크',150,5,26,3],['삶은 달걀 1개',75,1,6,5],
  ['고구마 1개(150g)',130,31,2,0],['바나나 1개',105,27,1,0],['사과 1개',95,25,0,0],
  ['그릭요거트 100g',60,4,10,1],['프로틴 쉐이크 1잔',130,5,24,2],['프로틴바',200,20,20,6],
  ['아메리카노',5,1,0,0],['카페라떼',130,10,7,7],['김치찌개',250,12,18,14],['된장찌개',150,10,12,7],

function calcTargets(p){
  const bmr=p.sex==='남'?10*p.weight+6.25*p.height-5*p.age+5:10*p.weight+6.25*p.height-5*p.age-161;
  const tdee=bmr*[1.2,1.375,1.55,1.725][p.activity];
  const g=GOALS[p.goal];
  const kcal=Math.round((tdee+g.adj)/10)*10;
  const pro=Math.round(p.weight*g.proPerKg);
  const fat=Math.max(Math.round(p.weight*0.7),Math.round(kcal*0.25/9)); // 호르몬 하한선
  const carb=Math.max(0,Math.round((kcal-pro*4-fat*9)/4));
  return{kcal,pro,fat,carb};
}
function pick(group,place,n){
  const pool=EX_DB[group].filter(e=>e.p==='both'||e.p===place);
  return[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));
}
function buildRoutine(p){
  const SPLITS={
    2:[['전신 A',['chest','back','legs','core']],['전신 B',['shoulders','legs','arms','core']]],
    3:[['푸시 — 가슴·어깨',['chest','chest','shoulders','arms']],['풀 — 등·팔',['back','back','arms','core']],['하체',['legs','legs','legs','core']]],
    4:[['상체 A — 무겁게',['chest','back','shoulders']],['하체 A',['legs','legs','core']],['상체 B — 볼륨',['chest','back','arms']],['하체 B',['legs','legs','core']]],
    5:[['가슴',['chest','chest','shoulders','arms']],['등',['back','back','arms']],['하체 A',['legs','legs','core']],['어깨·팔',['shoulders','shoulders','arms','arms']],['하체 B·코어',['legs','core','core']]]
  };
  const g=GOALS[p.goal],sch=g.scheme;
  return SPLITS[Math.min(5,Math.max(2,p.days))].map(([title,groups])=>{
    const used=new Set(),exercises=[];
    groups.forEach(gr=>{
      const c=pick(gr,p.place,4).find(e=>!used.has(e.n));if(!c)return;
      used.add(c.n);
      exercises.push({n:c.n,g:gr,lo:c.lo,sets:gr==='cardio'?1:sch.sets,rMin:sch.rMin,rMax:sch.rMax});
    });
    if(g.cardio){const c=pick('cardio',p.place,2).find(e=>!used.has(e.n));
      if(c){used.add(c.n);exercises.push({n:c.n,g:'cardio',lo:0,sets:1,rMin:1,rMax:1});}}
    return{title,exercises};
  });
}
/* 지난 기록 기반 다음 중량 제안 — 더블 프로그레션 */
function suggest(ex){
  const h=S.exHist[ex.n];if(!h||!h.length)return null;
  const last=h[h.length-1];
  if(!last.top)return null;
  const inc=ex.lo?5:2.5;
  return last.allMax?{w:last.top+inc,up:true}:{w:last.top,up:false};
}

function renderWorkoutCard(){
  const l=log(todayStr),card=$('workoutCard');
  const plan=S.routine[(l.wo&&l.wo.planIdx!=null)?l.wo.planIdx:S.workIdx];
  if(!plan){card.innerHTML='<h2>오늘의 운동</h2><div class="empty">루틴이 없어요 — 플랜 탭에서 생성</div>';return;}
  if(!l.wo)l.wo={planIdx:S.workIdx,sets:{},done:false};
  const wo=l.wo;
  let html=`<h2>오늘의 운동 — ${plan.title}${wo.done?' <span style="color:var(--teal)">✓ 완료</span>':''}</h2>`;
  plan.exercises.forEach(ex=>{
    if(!wo.sets[ex.n])wo.sets[ex.n]=Array.from({length:ex.sets},()=>({w:'',r:'',ok:false}));
    const sg=suggest(ex);
    html+=`<div class="ex">
      <div class="row"><div class="grow">
        <span class="name">${ex.n}</span>
        <span class="meta"> ${GROUP_KO[ex.g]} · ${ex.sets}세트 × ${ex.g==='cardio'?'완료 체크':ex.rMin+'~'+ex.rMax+'회'}</span>
      </div>${sg?`<span class="sugg mono">${sg.up?'🔥 오늘 '+sg.w+'kg 도전':'목표 '+sg.w+'kg'}</span>`:''}</div>`;
    wo.sets[ex.n].forEach((st,i)=>{
      html+=`<div class="setrow">
        <span class="no mono">${i+1}</span>
        <input type="number" inputmode="decimal" placeholder="${sg?sg.w:'kg'}" value="${st.w}" data-ex="${ex.n}" data-i="${i}" data-f="w" ${wo.done?'disabled':''}>
        <input type="number" inputmode="numeric" placeholder="회" value="${st.r}" data-ex="${ex.n}" data-i="${i}" data-f="r" ${wo.done?'disabled':''}>
        <button class="ok ${st.ok?'done':''}" data-ex="${ex.n}" data-i="${i}" ${wo.done?'disabled':''}>✓</button>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`<div class="timer-row">
      <button data-t="60">휴식 60초</button><button data-t="90">90초</button><button data-t="120">2분</button><button data-t="180">3분</button>
    </div>
    <div style="margin-top:.8rem">
    <button class="btn" id="finishWo" ${wo.done?'disabled':''}>${wo.done?'오늘 세션 완료 ✓':'세션 완료하기'}</button></div>
    <div style="margin-top:.5rem"><button class="btn sm gray" id="swapWo" ${wo.done?'disabled':''}>세션 변경</button></div>`;
  card.innerHTML=html;
  card.querySelectorAll('.setrow input').forEach(inp=>inp.onchange=()=>{
    wo.sets[inp.dataset.ex][+inp.dataset.i][inp.dataset.f]=inp.value===''?'':+inp.value;save();
  });
  card.querySelectorAll('.setrow .ok').forEach(b=>b.onclick=()=>{
    const st=wo.sets[b.dataset.ex][+b.dataset.i];st.ok=!st.ok;save();renderWorkoutCard();
  });
  card.querySelectorAll('.timer-row button').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
  const fin=$('finishWo');
  if(fin&&!wo.done)fin.onclick=()=>{
    // 기록을 exHist에 반영 (더블 프로그레션 판정)
    plan.exercises.forEach(ex=>{
      const sets=wo.sets[ex.n].filter(s=>s.ok||s.w!==''||s.r!=='');
      if(!sets.length)return;
      const top=Math.max(0,...sets.map(s=>+s.w||0));
      const allMax=sets.length>=ex.sets&&sets.every(s=>(+s.r||0)>=ex.rMax)&&top>0;
      if(!S.exHist[ex.n])S.exHist[ex.n]=[];
      S.exHist[ex.n].push({d:todayStr,top:top||null,allMax});
    });
    wo.done=true;S.workIdx=(wo.planIdx+1)%S.routine.length;
    save();toast('세션 완료! 다음 목표 무게를 계산했어요 💪');renderAll();
  };
  const sw=$('swapWo');
  if(sw&&!wo.done)sw.onclick=()=>{
    const names=S.routine.map((r,i)=>`${i+1}. ${r.title}`).join('\n');
    const v=prompt('오늘만 할 세션 번호를 입력하세요:\n'+names,String(wo.planIdx+1));
    const i=parseInt(v,10)-1;
    if(i>=0&&i<S.routine.length){wo.planIdx=i;wo.sets={};save();renderWorkoutCard();}
  };
}

let TIMER=null;
function startTimer(sec){
  clearInterval(TIMER&&TIMER.iv);
  TIMER={end:Date.now()+sec*1000};
  const pill=$('timerPill');pill.style.display='block';
  TIMER.iv=setInterval(()=>{
    const left=Math.ceil((TIMER.end-Date.now())/1000);
    if(left<=0){stopTimer();beep();return;}
    pill.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} — 탭하면 취소`;
  },250);
}

function beep(){
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    o.frequency.value=880;g.gain.setValueAtTime(.25,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.7);o.start();o.stop(ac.currentTime+.7);}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,80,200]);
  toast('휴식 끝 — 다음 세트! 🔔');
}

/* ================= 진척 탭 ================= */
function movAvg(arr,n){
  return arr.map((_,i)=>{
    const s=arr.slice(Math.max(0,i-n+1),i+1);
    return s.reduce((a,b)=>a+b.v,0)/s.length;
  });
}
function weekAvg(list,from,to){ // from,to: days ago
  const a=new Date(Date.now()-from*DAY_MS).toISOString().slice(0,10);
  const b=new Date(Date.now()-to*DAY_MS).toISOString().slice(0,10);
  const s=list.filter(w=>w.d>b&&w.d<=a);
  return s.length?s.reduce((x,y)=>x+y.v,0)/s.length:null;
}
function proteinDays(n){
  let cnt=0;
  for(let i=0;i<n;i++){const d=new Date(Date.now()-i*DAY_MS).toISOString().slice(0,10);
    if(fuelTotals(d).p>=S.profile.pro*0.9)cnt++;}
  return cnt;
}
function buildSignals(){
  const P=S.profile,sig=[],g=GOALS[P.goal];
  const cur=weekAvg(S.weights,0,7),prev=weekAvg(S.weights,7,14);
  // 1) 페이스
  if(cur!=null&&prev!=null){
    const diff=cur-prev,pace=g.pace;
    const okDir=pace<0?diff<=pace*0.5:diff>=pace*0.5;
    const tooFast=pace<0?diff<pace*2:diff>pace*2.5;
    if(tooFast)sig.push(['crit',`주 ${diff.toFixed(2)}kg 변화 — 페이스가 너무 빨라요. ${pace<0?'근손실 위험, 칼로리 +150':'지방 축적 위험, 칼로리 -150'} 조정 권장`]);
    else if(okDir)sig.push(['ok',`체중 페이스 정상 ✓ (주 평균 ${diff>=0?'+':''}${diff.toFixed(2)}kg, 목표 ${pace>0?'+':''}${pace}kg)`]);
    else sig.push(['warn',`정체 구간 — 주 평균 ${diff>=0?'+':''}${diff.toFixed(2)}kg. ${pace<0?'칼로리 -100 또는 걷기 +2천보':'칼로리 +100 추가'} 를 고려하세요`]);
  }else sig.push(['warn','체중을 2주 이상 기록하면 페이스 판정이 시작돼요']);
  // 2) 단백질
  const pd=proteinDays(7);
  sig.push([pd>=5?'ok':'warn',`단백질 목표(90%+) 달성 ${pd}/7일 ${pd>=5?'✓':'— 큰 적자에서 근손실 방어의 전부예요'}`]);
  // 3) 운동 빈도
  const wf=workoutsInLast(7);
  sig.push([wf>=P.days?'ok':'warn',`운동 ${wf}/${P.days}회(최근 7일) ${wf>=P.days?'✓':'— 신호는 빈도가 아니라 강도지만, 계획만큼은 채워요'}`]);
  // 4) 중량 정체 감지
  const stalled=Object.entries(S.exHist).filter(([n,h])=>{
    if(h.length<3)return false;
    const last3=h.slice(-3).map(x=>x.top||0);
    return last3[0]>0&&last3[0]===last3[1]&&last3[1]===last3[2];
  }).map(([n])=>n);
  if(stalled.length)sig.push(['warn',`중량 정체: ${stalled.join(', ')} — 세트당 1회씩 늘려 재도전하거나 1주 디로드(60%)를 고려하세요`]);
  // 5) 허리 가드레일
  if(S.waists.length){
    const min=Math.min(...S.waists.map(w=>w.v)),last=S.waists[S.waists.length-1].v;
    if(last>min+3)sig.push(['crit',`⚠️ 허리 ${last}cm — 최저점(${min}cm)+3cm 초과. 체중이 아니라 허리가 판정합니다: 증량을 멈추고 미니컷 권장`]);
    else sig.push(['ok',`허리 가드레일 안전 (${last}cm / 기준 ${(min+3).toFixed(1)}cm)`]);
  }
  // 6) 도달 예측
  const w14=weekAvg(S.weights,0,7),w14b=weekAvg(S.weights,7,14);
  if(w14!=null&&w14b!=null&&Math.abs(w14-w14b)>0.02){
    const perDay=(w14-w14b)/7,remain=P.goalW-(S.weights[S.weights.length-1].v);
    if((remain<0&&perDay<0)||(remain>0&&perDay>0)){
      const days=Math.round(remain/perDay);
      if(days>0&&days<400){
        const eta=new Date(Date.now()+days*DAY_MS);
        sig.push(['ok',`이 페이스면 목표 ${P.goalW}kg 도달 예상: ${eta.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})} (약 ${days}일 후)`]);
      }
    }
  }
  return sig;
}
function renderProg(){
  const COLORS={ok:'var(--teal)',warn:'var(--acc)',crit:'var(--crit)'};
  $('signals').innerHTML=buildSignals().map(([lv,txt])=>
    `<div class="signal"><span class="dot" style="background:${COLORS[lv]}"></span><span>${txt}</span></div>`).join('');
  drawWeight();drawWaist();
  // 주간 요약
  const cur=weekAvg(S.weights,0,7),prev=weekAvg(S.weights,7,14);
  const t7=(()=>{let k=0,n=0;for(let i=0;i<7;i++){const d=new Date(Date.now()-i*DAY_MS).toISOString().slice(0,10);
    const t=fuelTotals(d);if(t.kcal>0){k+=t.kcal;n++;}}return n?Math.round(k/n):0;})();
  $('weekly').innerHTML=`
    <div class="kv"><span class="muted">체중 주 평균</span><b class="mono">${cur?cur.toFixed(1)+'kg':'–'} ${cur&&prev?`(${(cur-prev)>=0?'+':''}${(cur-prev).toFixed(2)})`:''}</b></div>
    <div class="kv"><span class="muted">운동 세션</span><b class="mono">${workoutsInLast(7)} / ${S.profile.days}회</b></div>
    <div class="kv"><span class="muted">단백질 달성일</span><b class="mono">${proteinDays(7)} / 7일</b></div>
    <div class="kv"><span class="muted">일 평균 섭취(기록일)</span><b class="mono">${t7||'–'} kcal</b></div>`;
}
function chartBase(cv){
  const ctx=cv.getContext('2d'),css=getComputedStyle(document.documentElement);
  ctx.clearRect(0,0,cv.width,cv.height);
  return{ctx,MUT:css.getPropertyValue('--mut'),LINE:css.getPropertyValue('--line'),
    ACC:css.getPropertyValue('--acc'),TEAL:css.getPropertyValue('--teal'),CRIT:css.getPropertyValue('--crit')};
}
function drawWeight(){
  const cv=$('wChart'),{ctx,MUT,LINE,ACC,TEAL}=chartBase(cv);
  const data=S.weights.slice(-60);
  if(data.length<2){ctx.fillStyle=MUT;ctx.font='24px sans-serif';ctx.textAlign='center';
    ctx.fillText('체중을 2회 이상 기록하면 차트가 보여요',cv.width/2,cv.height/2);return;}
  const ma=movAvg(data,7),P=S.profile;
  const pad=52,W=cv.width,H=cv.height;
  const vals=data.map(d=>d.v).concat(ma,[P.goalW]);
  const min=Math.min(...vals)-0.6,max=Math.max(...vals)+0.6;
  const X=i=>pad+(W-pad-14)*i/(data.length-1),Y=v=>H-30-(H-46)*(v-min)/(max-min);
  ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.font='19px sans-serif';ctx.fillStyle=MUT;ctx.textAlign='left';
  [min+0.6,(min+max)/2,max-0.6].forEach(v=>{ctx.beginPath();ctx.moveTo(pad,Y(v));ctx.lineTo(W-10,Y(v));ctx.stroke();ctx.fillText(v.toFixed(1),2,Y(v)+6);});
  // 목표선
  ctx.setLineDash([7,5]);ctx.strokeStyle=TEAL;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pad,Y(P.goalW));ctx.lineTo(W-10,Y(P.goalW));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=TEAL;ctx.fillText('목표 '+P.goalW,W-110,Y(P.goalW)-7);
  // 일별 (점)
  ctx.fillStyle=MUT;
  data.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.v),4,0,7);ctx.fill();});
  // 7일 이동평균 (선 — 판정 기준)
  ctx.strokeStyle=ACC;ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();
  ma.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();
}
function drawWaist(){
  const card=$('waistCard');
  if(!S.waists.length){card.style.display='none';return;}
  card.style.display='block';
  const cv=$('waistChart'),{ctx,MUT,LINE,CRIT,TEAL}=chartBase(cv);
  const data=S.waists.slice(-60);
  if(data.length<2){ctx.fillStyle=MUT;ctx.font='22px sans-serif';ctx.textAlign='center';
    ctx.fillText('허리를 2회 이상 기록하면 차트가 보여요',cv.width/2,cv.height/2);return;}
  const minW=Math.min(...data.map(d=>d.v)),guard=minW+3;
  const pad=52,W=cv.width,H=cv.height;
  const vals=data.map(d=>d.v).concat([guard]);
  const min=Math.min(...vals)-1,max=Math.max(...vals)+1;
  const X=i=>pad+(W-pad-14)*i/(data.length-1),Y=v=>H-24-(H-40)*(v-min)/(max-min);
  ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.font='18px sans-serif';ctx.fillStyle=MUT;ctx.textAlign='left';
  [min+1,max-1].forEach(v=>{ctx.beginPath();ctx.moveTo(pad,Y(v));ctx.lineTo(W-10,Y(v));ctx.stroke();ctx.fillText(v.toFixed(1),2,Y(v)+6);});
  ctx.setLineDash([7,5]);ctx.strokeStyle=CRIT;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pad,Y(guard));ctx.lineTo(W-10,Y(guard));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=CRIT;ctx.fillText('가드레일 '+guard.toFixed(1),W-150,Y(guard)-6);
  ctx.strokeStyle=TEAL;ctx.lineWidth=3.5;ctx.lineJoin='round';ctx.beginPath();
  data.forEach((d,i)=>i?ctx.lineTo(X(i),Y(d.v)):ctx.moveTo(X(i),Y(d.v)));ctx.stroke();
  ctx.fillStyle=TEAL;data.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.v),4,0,7);ctx.fill();});
}
